[metadata]
name = klea_code
version = 0.0.1
author = Ankur Sinha
author_email = ankursinha@fedoraproject.org
url = https://github.com/NeuroML/neuroklea
project_urls =
    Documentation = https://neuroklea.org
    Source = https://github.com/NeuroML/neuroklea
license = GPL-3.0-or-later
description = AI assisted coding/workflow system
long_description = file: Readme.md
long_description_content_type = text/markdown
classifiers=
    Intended Audience :: Science/Research
    Natural Language :: English
    Operating System :: OS Independent
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering

[options]
install_requires =
    klea_utils
    langchain
    langchain-core
    langchain-mcp-adapters
    aiohttp[speedups]
    beautifulsoup4
    typer
    # typer must be <0.27 for Python 3.12: docling 2.x (via docling-slim[standard])
    # requires typer<0.27.0, and newer typer otherwise forces docling back to 1.x
    typer>=0.12,<0.27
    yaspin

include_package_data = True
packages = find:

[options.packages.find]
where = .

[options.entry_points]
console_scripts =
    klea-code                = klea_code.ui.cli:code_app
    klea-code-serve          = klea_code.api.server:serve_app

[options.package_data]
klea_code =
    *.md

[options.extras_require]
ollama =
    klea_utils[ollama]

huggingface =
    klea_utils[huggingface]

nicegui =
    klea_utils[nicegui]

full =
    klea_code
    klea_code[ollama]
    klea_code[huggingface]
    klea_code[nicegui]

test =
    pytest
    pytest-asyncio
    langchain-ollama
    klea_code[full]

dev =
    klea_code[test]
    pre-commit
    isort
    ruff
    mypy


[flake8]
extend-ignore = E501, E502, F403, F405, W503, W504, E251
